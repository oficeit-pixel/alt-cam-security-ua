<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ALT-CAM Admin</title><link rel="stylesheet" href="admin.css?v=1"></head><body>
<main class="admin-shell"><header><a href="index.html"><img src="assets/alt-cam-mark.png" alt="ALT-CAM"></a><div><b>ALT-CAM</b><small>ADMIN CONTROL</small></div><button id="logout" hidden>Вийти</button></header>
<section class="login" id="login"><form id="login-form"><span>ЗАХИЩЕНИЙ ВХІД</span><h1>Адмін-панель</h1><label>Email<input name="email" type="email" value="altcam777@gmail.com" autocomplete="username" required></label><label>Пароль<input name="password" type="password" autocomplete="current-password" required></label><button>Увійти</button><p id="login-status"></p></form></section>
<section id="app" hidden><nav><button data-view="dashboard" class="active">Огляд</button><button data-view="orders">Замовлення</button><button data-view="prices">Ціни</button><button data-view="users" class="chief-only" hidden>Адміністратори</button><button data-view="audit" class="chief-only" hidden>Журнал дій</button></nav>
<div id="dashboard" class="view"><div class="metrics" id="metrics"></div><section class="panel"><h2>Популярні товари та послуги</h2><div id="popular"></div></section></div>
<div id="orders" class="view" hidden><div class="view-head"><h1>Замовлення</h1><select id="order-filter"><option value="">Усі статуси</option><option value="new">Нові</option><option value="confirmed">Підтверджені</option><option value="awaiting_payment">Очікують оплату</option><option value="packing">Комплектуються</option><option value="shipped">Відправлені</option><option value="completed">Завершені</option><option value="canceled">Скасовані</option></select></div><div id="order-list"></div></div>
<div id="prices" class="view" hidden><div class="view-head"><div><h1>Коригування цін</h1><p>Зміни перекривають ціну фіда на сайті.</p></div></div><form id="price-form" class="price-form"><input name="product_id" placeholder="ID товару, наприклад viatec-7264" required><input name="price" type="number" min="1" step="0.01" placeholder="Ціна ₴" required><button>Зберегти</button></form><div id="price-list"></div></div>
<div id="users" class="view" hidden><div class="view-head"><div><h1>Адміністратори</h1><p>Головний адміністратор може додати до трьох співробітників.</p></div></div><form id="user-form" class="user-form"><input name="name" placeholder="Ім’я адміністратора" required><input name="email" type="email" placeholder="Email" required><input name="password" type="password" minlength="10" placeholder="Тимчасовий пароль, від 10 символів" required><button>Додати</button></form><p id="user-status"></p><div id="user-list"></div></div>
<div id="audit" class="view" hidden><div class="view-head"><div><h1>Журнал дій</h1><p>Входи, зміни замовлень, цін і облікових записів.</p></div></div><div id="audit-list"></div></div>
</section></main><script src="admin.js?v=1"></script></body></html>
