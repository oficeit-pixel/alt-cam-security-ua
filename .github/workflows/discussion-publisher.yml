name: ALT-CAM Discussion Publisher

on:
  schedule:
    - cron: "11,26,41,56 * * * *"
  workflow_dispatch:
    inputs:
      force_post_id:
        description: "Optional discussion post ID"
        required: false
        type: string
      force_platform:
        description: "Optional platform"
        required: false
        type: choice
        options:
          - ""
          - facebook
          - instagram_story
          - facebook_story

permissions:
  contents: write

concurrency:
  group: alt-cam-discussion-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      META_GRAPH_VERSION: v21.0
      FACEBOOK_PAGE_ID: "962902993572061"
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN_STABLE }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      SOCIAL_POSTS_FILE: social-posts/meta-automation/discussion-posts.json
      SOCIAL_STATE_FILE: social-posts/meta-automation/discussion-state.json
      MAX_POSTS_PER_RUN: "1"
      MIN_SUCCESS_INTERVAL_MINUTES: "120"
      DRY_RUN: "false"
      FAIL_ON_PUBLISH_ERROR: "false"
      DISABLED_PLATFORMS: ""
      WORKFLOW_FORCE_POST_ID: ${{ inputs.force_post_id || '' }}
      WORKFLOW_FORCE_PLATFORM: ${{ inputs.force_platform || '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r social-posts/meta-automation/requirements.txt

      - name: Publish due discussion item
        shell: bash
        run: |
          args=()
          if [ -n "$WORKFLOW_FORCE_POST_ID" ]; then
            args+=(--force --post-id "$WORKFLOW_FORCE_POST_ID")
          fi
          if [ -n "$WORKFLOW_FORCE_PLATFORM" ]; then
            args+=(--platform "$WORKFLOW_FORCE_PLATFORM")
          fi
          python social-posts/meta-automation/publish_due.py "${args[@]}"

      - name: Save discussion state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$SOCIAL_STATE_FILE"
          if ! git diff --cached --quiet; then
            git commit -m "Update discussion publisher state [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" || true
              if git push; then
                break
              fi
              if [ "$attempt" = "3" ]; then
                exit 1
              fi
              sleep 2
            done
          fi
