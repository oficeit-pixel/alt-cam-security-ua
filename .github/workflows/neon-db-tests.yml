name: Neon database tests
on:
  pull_request:
    paths: ['main.py', 'bot/**', 'alembic/**', 'tests/backend/**', '.github/workflows/neon-db-tests.yml']
  workflow_dispatch:
jobs:
  postgres17:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://postgres:test-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r bot/requirements-dev.txt
      - run: python -m pytest tests/backend -q
