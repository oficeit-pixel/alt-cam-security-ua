name: ALT-CAM Facebook Publisher

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      force_post_id:
        description: "Optional post ID to process now"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: alt-cam-social-state
  cancel-in-progress: false

jobs:
  publish-facebook:
    runs-on: ubuntu-latest
    env:
      META_GRAPH_VERSION: v21.0
      FACEBOOK_PAGE_ID: "962902993572061"
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_SYSTEM_USER_TOKEN }}
      SOCIAL_POSTS_FILE: social-posts/meta-automation/august-priority-posts.json
      SOCIAL_STATE_FILE: social-posts/meta-automation/august-priority-state.json
      MAX_POSTS_PER_RUN: "1"
      MIN_SUCCESS_INTERVAL_MINUTES: "120"
      DRY_RUN: "false"
      FAIL_ON_PUBLISH_ERROR: "true"
      PUBLISHING_PAUSED: "false"
      DISABLED_PLATFORMS: "facebook_story,instagram,instagram_story,threads,telegram,tiktok"
      WORKFLOW_FORCE_POST_ID: ${{ inputs.force_post_id || '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r social-posts/meta-automation/requirements.txt
      - name: Require permanent Facebook System User token
        run: test -n "$FACEBOOK_PAGE_ACCESS_TOKEN"
      - name: Publish next Facebook item
        if: env.PUBLISHING_PAUSED != 'true'
        shell: bash
        run: |
          args=(--platform facebook --platform facebook_story)
          if [ -n "$WORKFLOW_FORCE_POST_ID" ]; then
            args+=(--force --post-id "$WORKFLOW_FORCE_POST_ID")
          fi
          python social-posts/meta-automation/publish_due.py "${args[@]}"
      - name: Save publication state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$SOCIAL_STATE_FILE"
          if ! git diff --cached --quiet; then
            git commit -m "Update Facebook publisher state [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
