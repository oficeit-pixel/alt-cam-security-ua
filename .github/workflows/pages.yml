name: Deploy Alt-Cam Security UA

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Build public site only
        run: node scripts/build-site.mjs
      - name: Verify public build before publishing
        run: npm test
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Wait for uploaded Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Upload finalization can precede artifact visibility in the REST API.
          for attempt in {1..12}; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')
            if [ "$count" -eq 1 ]; then
              echo "Pages artifact is visible for this workflow run."
              exit 0
            fi
            echo "Waiting for Pages artifact metadata ($attempt/12)."
            sleep 5
          done
          echo "Pages artifact did not become available; refusing to deploy."
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
