name: ALT-CAM Social Publisher

on:
  schedule:
    # Four checks per hour, shifted away from :00 where GitHub Actions is busiest.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      force_post_id:
        description: "Optional post ID to process now"
        required: false
        type: string
      force_platform:
        description: "Optional platform limit"
        required: false
        type: choice
        options:
          - ""
          - facebook
          - instagram
          - threads
          - telegram
          - tiktok

permissions:
  contents: write

concurrency:
  group: alt-cam-social-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      META_GRAPH_VERSION: v21.0
      FACEBOOK_PAGE_ID: "962902993572061"
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN_STABLE }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_TOKEN_ENCRYPTION_KEY: ${{ secrets.TIKTOK_TOKEN_ENCRYPTION_KEY }}
      TIKTOK_POST_MODE: ${{ vars.TIKTOK_POST_MODE || 'MEDIA_UPLOAD' }}
      TIKTOK_PRIVACY_LEVEL: ${{ vars.TIKTOK_PRIVACY_LEVEL || 'PUBLIC_TO_EVERYONE' }}
      SOCIAL_POSTS_FILE: social-posts/weekly-automation/posts.json
      SOCIAL_STATE_FILE: social-posts/weekly-automation/state.json
      MAX_POSTS_PER_RUN: "1"
      ALT_CAM_TELEGRAM_GROUP_URL: https://t.me/altcam_security_ua
      DRY_RUN: "false"
      FAIL_ON_PUBLISH_ERROR: "false"
      # Temporary quality-control pause while August media is being rebuilt.
      PUBLISHING_PAUSED: "true"
      WORKFLOW_FORCE_POST_ID: ${{ inputs.force_post_id || '' }}
      WORKFLOW_FORCE_PLATFORM: ${{ inputs.force_platform || '' }}
      # TikTok uses the approved Upload-to-Inbox flow; Direct Post is not enabled.
      DISABLED_PLATFORMS: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r social-posts/meta-automation/requirements.txt

      - name: Refresh TikTok token securely
        run: node social-posts/tiktok-automation/cloud_refresh_token.mjs

      - name: Check publisher setup
        continue-on-error: true
        run: python social-posts/meta-automation/check_setup.py

      - name: Publish due posts
        if: env.PUBLISHING_PAUSED != 'true'
        shell: bash
        run: |
          args=()
          if [ -n "$WORKFLOW_FORCE_POST_ID" ]; then
            args+=(--force --post-id "$WORKFLOW_FORCE_POST_ID")
          fi
          if [ -n "$WORKFLOW_FORCE_PLATFORM" ]; then
            args+=(--platform "$WORKFLOW_FORCE_PLATFORM")
          fi
          python social-posts/meta-automation/publish_due.py "${args[@]}"

      - name: Save publication state
        if: always()
        run: |
          if [ -f social-posts/weekly-automation/state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f social-posts/weekly-automation/state.json social-posts/tiktok-automation/cloud-token.enc.json
            if ! git diff --cached --quiet; then
              git commit -m "Update social publisher state [skip ci]"
              git push
            fi
          fi
