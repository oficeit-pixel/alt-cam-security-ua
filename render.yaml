services:
  - type: web
    name: alt-cam-manager-bot
    runtime: python
    plan: free
    buildCommand: pip install -r bot/requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: INSTALLER_GROUP_ID
        sync: false
      - key: CLIENT_GROUP_ID
        sync: false
      - key: CLIENT_GROUP_URL
        sync: false
      - key: SITE_LEAD_GROUP_ID
        sync: false
      - key: SITE_PUBLIC_ORIGIN
        value: https://oficeit-pixel.github.io
      - key: BOT_USERNAME
        value: AltCamSecurityUaBot
      - key: CHANNEL_ID
        value: "@altcam_security_ua"
