services:
  - type: web
    name: alt-cam-crm-api
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r bot/requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false
      - key: SITE_PUBLIC_ORIGIN
        value: https://alt-cam.net.ua
      - key: BOT_USERNAME
        value: AltCamSecurityUaBot
      - key: CHANNEL_ID
        value: "@altcam_security_ua"
      - key: ADMIN_WEB_EMAIL
        value: altcam777@gmail.com
      - key: ADMIN_WEB_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: ADMIN_SITE_URL
        value: https://alt-cam.net.ua/admin/
      - key: SMTP_USER
        value: altcam.ua@gmail.com
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_RELAY_URL
        sync: false
      - key: EMAIL_RELAY_SECRET
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_FILE
        value: /etc/secrets/google-service-account.json
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: UKRPOSHTA_TRACKING_TOKEN
        sync: false
      - key: IMAP_USER
        sync: false
      - key: IMAP_PASSWORD
        sync: false
      - key: SUPPLIER_EMAIL_SENDERS
        sync: false
      - key: AUTO_CREATE_DB
        value: "true"

  - type: web
    name: alt-cam-manager-bot
    runtime: python
    plan: free
    buildCommand: pip install -r bot/requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false
      - key: SITE_PUBLIC_ORIGIN
        value: https://alt-cam.net.ua
      - key: BOT_USERNAME
        value: AltCamSecurityUaBot
      - key: CHANNEL_ID
        value: "@altcam_security_ua"
      - key: ADMIN_WEB_EMAIL
        value: altcam777@gmail.com
      - key: ADMIN_WEB_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: ADMIN_SITE_URL
        value: https://alt-cam.net.ua/admin/
      - key: SMTP_USER
        value: altcam.ua@gmail.com
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_RELAY_URL
        sync: false
      - key: EMAIL_RELAY_SECRET
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_FILE
        value: /etc/secrets/google-service-account.json
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: UKRPOSHTA_TRACKING_TOKEN
        sync: false
      - key: IMAP_USER
        sync: false
      - key: IMAP_PASSWORD
        sync: false
      - key: SUPPLIER_EMAIL_SENDERS
        sync: false
      - key: AUTO_CREATE_DB
        value: "true"
