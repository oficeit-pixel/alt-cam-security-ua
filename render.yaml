services:
  - type: web
    name: alt-cam-crm-api
    buildFilter:
      paths:
        - main.py
        - bot/**
        - alembic/**
        - alembic.ini
        - render.yaml
        - feeds/meta-catalog.csv
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r bot/requirements.txt
    startCommand: python main.py
    envVars:
      - key: ENABLE_BOT_POLLING
        value: "true"
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false
      - key: SITE_PUBLIC_ORIGIN
        value: https://alt-cam.net.ua
      - key: BOT_USERNAME
        value: AltCamSecurityUaBot
      - key: CHANNEL_ID
        value: "@altcam_security_ua"
      - key: ADMIN_WEB_EMAIL
        value: altcam777@gmail.com
      - key: ADMIN_WEB_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: ADMIN_SITE_URL
        value: https://alt-cam.net.ua/admin/
      - key: SMTP_USER
        value: altcam.ua@gmail.com
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_RELAY_URL
        sync: false
      - key: EMAIL_RELAY_SECRET
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_FILE
        value: /etc/secrets/google-service-account.json
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: GOOGLE_CONTACTS_SPREADSHEET_ID
        value: 1xWC-Ma6iUOKvAaMFnnT_CtHsVpG0gez79jQA-HVEQnc
      - key: UKRPOSHTA_TRACKING_TOKEN
        sync: false
      - key: IMAP_USER
        sync: false
      - key: IMAP_PASSWORD
        sync: false
      - key: SUPPLIER_EMAIL_SENDERS
        sync: false
      - key: AUTO_CREATE_DB
        value: "true"
      # Order pipeline (docs/ORDER_PIPELINE.md). Reminders run only on this (polling) service.
      - key: PIPELINE_ENABLED
        value: "true"
      - key: PIPELINE_LINK_SECRET
        generateValue: true
      - key: SECOND_CONTACT_CHAT_ID
        sync: false
      - key: OWNER_USERNAMES
        value: "OficeITHelp"
      - key: SECOND_CONTACT_USERNAMES
        value: "uniwar"
      - key: REPLY_ETA_TEXT
        value: "протягом 5–10 хвилин"
      - key: BUSINESS_AUTOREPLY_ENABLED
        value: "true"
      # AI consultant (docs/AI_CONSULTANT.md): site chat + Telegram bot + Telegram Business.
      # Off until AI_CONSULTANT_ENABLED=true AND GEMINI_API_KEY is set in the dashboard.
      - key: AI_CONSULTANT_ENABLED
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: "https://generativelanguage.googleapis.com/v1beta/openai/"
      - key: LLM_MODEL
        value: "gemini-3.5-flash-lite"
      - key: REMINDER_MINUTES
        value: "5,15,60"
      - key: WORK_HOURS
        value: "09:00-19:00"
      - key: WORK_DAYS
        value: "0,1,2,3,4,5"
      - key: SHIP_CUTOFF
        value: "13:00"
      - key: NOVA_POSHTA_API_KEY
        sync: false
      - key: YUGTORG_API_KEY
        sync: false

  - type: web
    name: alt-cam-manager-bot
    buildFilter:
      paths:
        - main.py
        - bot/**
        - alembic/**
        - alembic.ini
        - render.yaml
        - feeds/meta-catalog.csv
    runtime: python
    plan: free
    buildCommand: pip install -r bot/requirements.txt
    startCommand: python main.py
    envVars:
      - key: ENABLE_BOT_POLLING
        value: "false"
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false
      - key: SITE_PUBLIC_ORIGIN
        value: https://alt-cam.net.ua
      - key: BOT_USERNAME
        value: AltCamSecurityUaBot
      - key: CHANNEL_ID
        value: "@altcam_security_ua"
      - key: ADMIN_WEB_EMAIL
        value: altcam777@gmail.com
      - key: ADMIN_WEB_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: ADMIN_SITE_URL
        value: https://alt-cam.net.ua/admin/
      - key: SMTP_USER
        value: altcam.ua@gmail.com
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_RELAY_URL
        sync: false
      - key: EMAIL_RELAY_SECRET
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_FILE
        value: /etc/secrets/google-service-account.json
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: GOOGLE_CONTACTS_SPREADSHEET_ID
        value: 1xWC-Ma6iUOKvAaMFnnT_CtHsVpG0gez79jQA-HVEQnc
      - key: UKRPOSHTA_TRACKING_TOKEN
        sync: false
      - key: IMAP_USER
        sync: false
      - key: IMAP_PASSWORD
        sync: false
      - key: SUPPLIER_EMAIL_SENDERS
        sync: false
      - key: AUTO_CREATE_DB
        value: "true"
